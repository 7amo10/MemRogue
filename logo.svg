<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="structure-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00c6ff;stop-opacity:1" /> <stop offset="100%" style="stop-color:#0072ff;stop-opacity:1" /> </linearGradient>
    
    <linearGradient id="highlight-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffba00;stop-opacity:1" /> <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:1" /> </linearGradient>
    
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="trace-glow" x="-50%" y="-50%" width="200%" height="200%">
       <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
       <feMerge>
           <feMergeNode in="coloredBlur"/>
           <feMergeNode in="SourceGraphic"/>
       </feMerge>
    </filter>
  </defs>

  <rect width="800" height="300" fill="#0f111a" rx="15" ry="15"/>

  <g transform="translate(100, 150)">
    
    <g transform="translate(0, 0)" filter="url(#soft-shadow)">
      <path d="M86.6,0 L173.2,50 L173.2,150 L86.6,200 L0,150 L0,50 Z" fill="url(#structure-grad)" transform="translate(-86.6, -100) scale(0.8)"/>
      
      <g transform="translate(-86.6, -100) scale(0.8)" stroke="#0f111a" stroke-width="4" stroke-linecap="round">
        <line x1="86.6" y1="0" x2="86.6" y2="200" />
        <line x1="0" y1="50" x2="173.2" y2="50" />
        <line x1="0" y1="150" x2="173.2" y2="150" />
        <line x1="43.3" y1="25" x2="43.3" y2="175" />
        <line x1="129.9" y1="25" x2="129.9" y2="175" />
      </g>
      
      <path d="M-50,-60 L-20,-60 L-20,0 L20,0 L20,60" fill="none" stroke="#ffba00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#trace-glow)"/>
      
      <rect x="10" y="45" width="40" height="35" fill="url(#highlight-grad)" rx="4" filter="url(#trace-glow)"/>
    </g>

    <text x="120" y="20" font-family="'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="72" fill="#ffffff" letter-spacing="-1">
      MEMROGUE
    </text>
    
    <text x="125" y="60" font-family="'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="24" fill="#a0a8b8" letter-spacing="1.5">
      ADVANCED MEMORY DEBUGGER
    </text>
  </g>
</svg>
